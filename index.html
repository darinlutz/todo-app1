<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Todo App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="mx-auto" style="max-width: 700px;">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
            <div>
              <h1 class="h3 mb-1">Todo App</h1>
              <p class="text-muted mb-0">A responsive task list for phone and monitor screens.</p>
            </div>
            <span class="badge bg-info text-dark">Light blue theme</span>
          </div>

          <form id="todo-form" class="row g-2 align-items-center mb-4">
            <div class="col-sm">
              <input id="todo-input" class="form-control todo-input" type="text" placeholder="Add a todo" autocomplete="off" />
            </div>
            <div class="col-auto">
              <button type="submit" class="btn btn-primary px-4">Add</button>
            </div>
          </form>

          <ul id="todo-list" class="list-group todo-list"></ul>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
